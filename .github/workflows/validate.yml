name: Radar validation and freshness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 10:30 UTC+8, after the editor starts at 09:30 on Monday/Wednesday/Friday.
    - cron: '30 2 * * 1,3,5'
permissions:
  contents: read
concurrency:
  group: radar-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Check source records and generated pages
        run: python generate.py check
      - name: Report missed publications
        if: github.event_name == 'schedule'
        run: python generate.py plan --require-current
