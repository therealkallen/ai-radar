name: Radar validation and freshness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 10:30 UTC+8, after the editor starts at 09:30 on Monday/Wednesday/Friday.
    - cron: '30 2 * * 1,3,5'
permissions:
  contents: read
concurrency:
  group: radar-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Check source records and generated pages
        run: python generate.py check
      - name: Record editor workspace revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -c "import json,os,pathlib; pathlib.Path('radar-source.json').write_text(json.dumps({'sha':os.environ['GITHUB_SHA']}), encoding='utf-8')"
      - name: Export offline editor workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: radar-editor-workspace
          retention-days: 30
          if-no-files-found: error
          path: |
            radar-source.json
            generate.py
            rebuild.py
            README.md
            AI_Radar_Content_Pipeline_Skill.md
            coverage.md
            index.html
            content/*.json
            issues/*.html
            tests/*.py
            scripts/*.py
      - name: Report missed publications
        if: github.event_name == 'schedule'
        run: python generate.py plan --require-current
