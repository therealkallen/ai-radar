name: Radar live verification
on:
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare public pages to deployed revision
        run: python scripts/verify_live.py
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-live-verification
          path: live-verification.json
          if-no-files-found: warn
          retention-days: 30
